# Runs all Playwright tests (UI + API) on GitHub's servers after every push and pull request
name: Playwright tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  test:
    # Pinned: since Oct 2026 ubuntu-latest means Ubuntu 26.04, which Playwright 1.56 does not support yet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Save the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
